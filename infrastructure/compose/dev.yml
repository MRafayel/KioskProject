name: printing-kiosk-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: printing_kiosk
      POSTGRES_USER: printing_kiosk
      POSTGRES_PASSWORD: development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printing_kiosk -d printing_kiosk"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-development-user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-development-password-change-me}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-development-user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-development-password-change-me}
      S3_BUCKET: ${S3_BUCKET:-printing-kiosk-private}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-printing-kiosk-api}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-development-api-secret-change-me}
      S3_WORKER_ACCESS_KEY_ID: ${S3_WORKER_ACCESS_KEY_ID:-printing-kiosk-worker}
      S3_WORKER_SECRET_ACCESS_KEY: ${S3_WORKER_SECRET_ACCESS_KEY:-development-worker-secret-change-me}
      API_POLICY_JSON: >-
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::${S3_BUCKET:-printing-kiosk-private}"]},{"Effect":"Allow","Action":["s3:ListBucketVersions"],"Resource":["arn:aws:s3:::${S3_BUCKET:-printing-kiosk-private}"],"Condition":{"StringLike":{"s3:prefix":["quarantine/v1/*","normalized/v1/*","previews/v1/*"]}}},{"Effect":"Allow","Action":["s3:AbortMultipartUpload","s3:ListMultipartUploadParts","s3:PutObject"],"Resource":["arn:aws:s3:::${S3_BUCKET:-printing-kiosk-private}/quarantine/v1/*"]},{"Effect":"Allow","Action":["s3:DeleteObject","s3:DeleteObjectVersion"],"Resource":["arn:aws:s3:::${S3_BUCKET:-printing-kiosk-private}/quarantine/v1/*","arn:aws:s3:::${S3_BUCKET:-printing-kiosk-private}/normalized/v1/*","arn:aws:s3:::${S3_BUCKET:-printing-kiosk-private}/previews/v1/*"]},{"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::${S3_BUCKET:-printing-kiosk-private}/previews/v1/*"]}]}
      WORKER_POLICY_JSON: >-
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::${S3_BUCKET:-printing-kiosk-private}"]},{"Effect":"Allow","Action":["s3:ListBucketVersions"],"Resource":["arn:aws:s3:::${S3_BUCKET:-printing-kiosk-private}"],"Condition":{"StringLike":{"s3:prefix":["normalized/v1/*","previews/v1/*"]}}},{"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::${S3_BUCKET:-printing-kiosk-private}/quarantine/v1/*"]},{"Effect":"Allow","Action":["s3:AbortMultipartUpload","s3:DeleteObject","s3:DeleteObjectVersion","s3:ListMultipartUploadParts","s3:PutObject"],"Resource":["arn:aws:s3:::${S3_BUCKET:-printing-kiosk-private}/normalized/v1/*","arn:aws:s3:::${S3_BUCKET:-printing-kiosk-private}/previews/v1/*"]}]}
      LIFECYCLE_JSON: >-
        {"Rules":[{"ID":"temporary-quarantine-backstop","Status":"Enabled","Filter":{"Prefix":"quarantine/v1/"},"Expiration":{"Days":1},"AbortIncompleteMultipartUpload":{"DaysAfterInitiation":1}},{"ID":"temporary-normalized-backstop","Status":"Enabled","Filter":{"Prefix":"normalized/v1/"},"Expiration":{"Days":1},"AbortIncompleteMultipartUpload":{"DaysAfterInitiation":1}},{"ID":"temporary-preview-backstop","Status":"Enabled","Filter":{"Prefix":"previews/v1/"},"Expiration":{"Days":1},"AbortIncompleteMultipartUpload":{"DaysAfterInitiation":1}}]}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
        mc version suspend "local/$$S3_BUCKET"
        printf '%s\n' "$$LIFECYCLE_JSON" | mc ilm rule import "local/$$S3_BUCKET"
        mc admin user add local "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        printf '%s\n' "$$API_POLICY_JSON" > /tmp/api-policy.json
        mc admin policy create local printing-kiosk-api /tmp/api-policy.json
        mc admin policy attach local printing-kiosk-api --user "$$S3_ACCESS_KEY_ID"
        mc admin user add local "$$S3_WORKER_ACCESS_KEY_ID" "$$S3_WORKER_SECRET_ACCESS_KEY"
        printf '%s\n' "$$WORKER_POLICY_JSON" > /tmp/worker-policy.json
        mc admin policy create local printing-kiosk-worker /tmp/worker-policy.json
        mc admin policy attach local printing-kiosk-worker --user "$$S3_WORKER_ACCESS_KEY_ID"
    restart: "no"

  clamav-updater:
    build:
      context: ../docker/clamav-updater
      dockerfile: Dockerfile
    environment:
      CLAMAV_NO_CLAMD: "true"
      CLAMAV_NO_MILTERD: "true"
      FRESHCLAM_CHECKS: ${CLAMAV_UPDATE_CHECKS_PER_DAY:-12}
    networks:
      - malware_updates
    volumes:
      - clamav_signatures:/var/lib/clamav
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0700
      - /var/log/clamav:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pidof freshclam >/dev/null && test -s /var/lib/clamav/main.cvd && (test -s /var/lib/clamav/daily.cld || test -s /var/lib/clamav/daily.cvd)"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 32
    mem_limit: 768m
    cpus: 0.5
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable-debian@sha256:a73435b0fa51886e9e6dd1881656023ba9dce756e055f23981270badbb8ca3d7
    depends_on:
      clamav-updater:
        condition: service_healthy
    entrypoint: ["/init-unprivileged"]
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
      CLAMAV_NO_MILTERD: "true"
    networks:
      - processor_internal
    volumes:
      - clamav_signatures:/var/lib/clamav:ro
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700
      - /var/log/clamav:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 2g
    cpus: 1.0
    restart: unless-stopped

  document-processor:
    build:
      context: ../..
      dockerfile: infrastructure/docker/document-processor/Dockerfile
    depends_on:
      clamav:
        condition: service_healthy
    environment:
      DOCUMENT_PROCESSOR_AUTH_TOKEN: ${DOCUMENT_PROCESSOR_AUTH_TOKEN:-development-processor-auth-token-change-me}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-52428800}
      MAX_DOCUMENT_PAGES: ${MAX_DOCUMENT_PAGES:-200}
      MAX_IMAGE_DIMENSION_PIXELS: ${MAX_IMAGE_DIMENSION_PIXELS:-20000}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
      MAX_NORMALIZED_FILE_BYTES: ${MAX_NORMALIZED_FILE_BYTES:-104857600}
      MAX_PREVIEW_FILE_BYTES: ${MAX_PREVIEW_FILE_BYTES:-2097152}
      PREVIEW_MAX_WIDTH_PIXELS: ${PREVIEW_MAX_WIDTH_PIXELS:-1600}
      PREVIEW_MAX_HEIGHT_PIXELS: ${PREVIEW_MAX_HEIGHT_PIXELS:-2200}
      PROCESSOR_MAX_RESPONSE_BYTES: ${DOCUMENT_PROCESSOR_RESPONSE_MAX_BYTES:-536870912}
      DOCUMENT_PROCESSOR_TIMEOUT_SECONDS: ${DOCUMENT_PROCESSOR_TIMEOUT_SECONDS:-120}
      # Per-request stage timings. Off by default; one line per request when
      # enabled, and per-page samples only with PROCESSOR_TIMING_DETAIL.
      PROCESSOR_TIMING_LOG: ${PROCESSOR_TIMING_LOG:-}
      PROCESSOR_TIMING_DETAIL: ${PROCESSOR_TIMING_DETAIL:-}
      # Rendering/encoding effort. The defaults are tuned for throughput;
      # setting raster format to png with compression level 9 and adaptive
      # filtering on restores the pre-optimization output byte-for-byte.
      PROCESSOR_RASTER_FORMAT: ${PROCESSOR_RASTER_FORMAT:-}
      PROCESSOR_CANONICAL_PNG_COMPRESSION_LEVEL: ${PROCESSOR_CANONICAL_PNG_COMPRESSION_LEVEL:-}
      PROCESSOR_CANONICAL_PNG_ADAPTIVE_FILTERING: ${PROCESSOR_CANONICAL_PNG_ADAPTIVE_FILTERING:-}
      PROCESSOR_PREVIEW_WEBP_EFFORT: ${PROCESSOR_PREVIEW_WEBP_EFFORT:-}
    networks:
      - processor_internal
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${DOCUMENT_PROCESSOR_PIDS_LIMIT:-64}
    mem_limit: "${DOCUMENT_PROCESSOR_MEMORY_MIB:-3072}m"
    # Compose expresses CPU quota in microseconds per 100 ms period. The
    # configured value is millicores, so appending two zeroes converts
    # 1000m -> 100000 us (one CPU), 500m -> 50000 us, and so on.
    cpu_period: 100000
    cpu_quota: "${DOCUMENT_PROCESSOR_CPU_MILLIS:-1000}00"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${DOCUMENT_PROCESSOR_SCRATCH_BYTES:-2147483648},uid=10001,gid=10001,mode=0700
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3200/health/ready")
          .then((response)=>{if(!response.ok)process.exit(1)})
          .catch(()=>process.exit(1))
      interval: 15s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Docker Desktop does not publish a host port from an internal-only network.
  # This narrow TCP gateway exposes loopback to the host worker without giving
  # the untrusted document processor an egress-capable network interface.
  document-processor-gateway:
    image: node:24.18.0-bookworm-slim@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d
    depends_on:
      document-processor:
        condition: service_healthy
    command:
      - node
      - -e
      - >-
        const net=require("node:net");
        const server=net.createServer((client)=>{
          const upstream=net.connect(3200,"document-processor");
          const close=()=>{client.destroy();upstream.destroy()};
          client.on("error",close);
          upstream.on("error",close);
          client.pipe(upstream).pipe(client)
        });
        server.listen(3200,"0.0.0.0")
    ports:
      - "127.0.0.1:3200:3200"
    networks:
      - processor_internal
      - processor_gateway
    read_only: true
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3200/health/ready")
          .then((response)=>{if(!response.ok)process.exit(1)})
          .catch(()=>process.exit(1))
      interval: 10s
      # This proxies the processor's deep readiness check, which may spend up
      # to ten seconds checking scanner and native-tool readiness.
      timeout: 12s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_signatures:

networks:
  processor_internal:
    internal: true
  processor_gateway:
  malware_updates:
