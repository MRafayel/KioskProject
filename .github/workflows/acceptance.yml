name: Acceptance gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static, unit, browser, and dependency gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Create development test configuration
        run: cp .env.example .env

      # Playwright belongs to the two browser apps, not to the workspace root,
      # and pnpm keeps each package's binaries to itself. Running this from the
      # root cannot resolve the executable; the browser it downloads is shared
      # machine-wide, so installing once from either app serves both.
      - name: Install Playwright Chromium
        run: pnpm --filter @printing-kiosk/kiosk exec playwright install --with-deps chromium

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Build all applications and services
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate

  integration:
    name: Real infrastructure, migrations, and upgrades
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm db:generate

      - name: Create isolated test configuration
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: pnpm infra:validate

      - name: Start real infrastructure dependencies
        run: pnpm infra:up

      - name: Verify upgrade from a Phase 4 database fixture
        run: pnpm db:verify-phase5-upgrade

      - name: Verify upgrade from a Phase 5 database fixture
        run: pnpm db:verify-phase6-upgrade

      - name: Verify upgrade from a Phase 6 database fixture
        run: pnpm db:verify-phase7-upgrade

      - name: Apply all migrations to a fresh database
        run: pnpm db:migrate

      - name: Seed the development kiosk credential
        run: pnpm db:seed

      - name: Run serial destructive integration tests
        run: pnpm test:integration

      - name: Capture infrastructure diagnostics after failure
        if: failure()
        run: pnpm infra:logs

      - name: Stop infrastructure
        if: always()
        run: pnpm infra:down
